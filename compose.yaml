# compose.yaml
# Development stack: nginx (web server) -> php-fpm (PHP) -> MySQL (database).
# Start everything with: docker compose up -d --build
# Values like ${DB_NAME} are read from the .env file next to this one.

services:
  # Web server: receives HTTP requests and forwards PHP ones to php-fpm (FastCGI)
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80" # host:container -> http://localhost:8080
    volumes:
      - ./backend:/var/www/backend:ro # :ro = read-only, nginx never writes code
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # PHP-FPM: pool of PHP processes that runs the MVC backend
  php:
    build: ./docker/php
    volumes:
      - ./backend:/var/www/backend # live mount: code changes apply without rebuild
    env_file: .env # exposes DB_* variables to PHP (read with getenv())
    depends_on:
      database:
        condition: service_healthy # wait until MySQL really accepts connections

  # MySQL: the database
  database:
    image: mysql:9.7 # latest LTS line (long-term support)
    environment:
      MYSQL_DATABASE: ${DB_NAME} # database created on first start
      MYSQL_USER: ${DB_USER} # application user (least privilege, not root)
      # ":?" = fail fast: Compose refuses to start if the variable is missing or empty
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      # .sql files here run once, in alphabetical order, when the volume is empty
      - ./backend/database:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306" # 3307 on the Mac: 3306 is already used by Homebrew MySQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data: # named volume: data survives "docker compose down" (not "down -v")
