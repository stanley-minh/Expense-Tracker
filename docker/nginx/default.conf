# docker/nginx/default.conf
# Serves the backend and hands every request to the single entry point (front controller).

server {
    listen 80;
    server_name localhost;

    # Only public/ is exposed: config, src and database stay out of reach
    root /var/www/backend/public;

    # Existing file -> serve it; otherwise -> front controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Forward index.php to PHP-FPM ("php" = service name in compose.yaml)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        internal; # index.php cannot be requested directly by URL
    }

    # Any other .php file is refused (security)
    location ~ \.php$ {
        return 404;
    }
}
